<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اعتذار لسيرفر Lag City RP</title>
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 1;
        }

        /* شاشة الدخول الاحترافية */
        #enter-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s ease-out; /* تأثير اختفاء ناعم */
        }

        #enter-text {
            font-size: 2rem;
            color: #ff0000;
            text-shadow: 0 0 15px #ff0000;
            animation: pulseEnter 1.5s infinite;
            border: 2px solid #ff0000;
            padding: 15px 30px;
            border-radius: 10px;
            background: rgba(20, 0, 0, 0.5);
        }

        @keyframes pulseEnter {
            0%, 100% { transform: scale(1); box-shadow: 0 0 10px #ff0000; }
            50% { transform: scale(1.05); box-shadow: 0 0 25px #ff0000; }
        }

        /* صندوق الرسائل الزجاجي */
        #text-container {
            position: relative;
            z-index: 2;
            background: rgba(15, 15, 15, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 0, 0.4);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3), inset 0 0 15px rgba(0, 0, 0, 0.8);
            font-size: 1.6rem;
            text-align: center;
            max-width: 90%;
            width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            line-height: 1.8;
            padding: 40px 30px;
            box-sizing: border-box;
            display: none; /* مخفي في البداية حتى يتم الدخول */
        }

        #text-container::-webkit-scrollbar { display: none; }

        .server-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 25px auto;
            display: block;
            object-fit: cover;
            border: 3px solid #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8), 0 0 10px #fff;
            animation: pulseLogo 2s infinite;
        }

        @keyframes pulseLogo {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.8), 0 0 10px #fff; }
            50% { box-shadow: 0 0 40px rgba(255, 0, 0, 1), 0 0 20px #fff; }
        }

        .typed-line {
            margin: 0 0 15px 0;
            min-height: 1.2em;
            word-wrap: break-word;
            font-weight: 900;
            background: linear-gradient(90deg, #333333 0%, #ff0000 25%, #ffffff 50%, #ff0000 75%, #333333 100%);
            background-size: 200% auto;
            color: #000;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineGradient 3s linear infinite;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.2);
        }

        @keyframes shineGradient {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .cursor {
            display: inline-block;
            width: 12px;
            height: 1.2em;
            background-color: #ff0000;
            animation: blink 0.8s infinite;
            vertical-align: bottom;
            box-shadow: 0 0 15px #ff0000, 0 0 5px #fff;
            border-radius: 2px;
        }

        @keyframes blink { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0; } 
        }

        .main-title {
            font-size: 2.3rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000;
        }
    </style>
</head>
<body>

    <!-- شاشة الدخول -->
    <div id="enter-screen">
        <div id="enter-text">اضغط هنا للدخول للملف 👆</div>
    </div>

    <!-- طبقة الخلفية الداكنة -->
    <div class="overlay"></div>

    <!-- صندوق الرسائل الزجاجي -->
    <div id="text-container">
        <!-- يمكنك تغيير اسم الصورة logo.png إذا أردت رفع شعار السيرفر من جهازك -->
        <img src="https://images.unsplash.com/photo-1614728263952-84ea256f9679?q=80&w=200&h=200&auto=format&fit=crop" alt="Lag City RP Logo" class="server-logo">
    </div>

    <!-- الصوت المرفق -->
    <audio id="custom-audio" preload="auto" loop>
        <source src="MagicMic Voice Changer - Lag City RP.wav" type="audio/wav">
    </audio>

    <script>
        const container = document.getElementById('text-container');
        const audio = document.getElementById('custom-audio');
        const enterScreen = document.getElementById('enter-screen');

        const eventLines = [
            "⚠️ رسالة إعتذار رسمية ⚠️",
            "إلى إدارة وأعضاء سيرفر LAG CITY RP",
            "____________________________________",
            "\"الاعتراف بالخطأ فضيلة، والاحترام هو أساس مجتمعنا.\"",
            "أتقدم بخالص الاعتذار والأسف الشديد لسيرفر Lag City RP.",
            "عن أي تصرف أو خطأ صدر مني وتسبب في أي إزعاج لكم.",
            "نحن ندرك حجم المجهود الكبير الذي تبذلونه لتطوير السيرفر.",
            "ونحترم كافة القوانين والإدارة والقائمين على هذا المجتمع.",
            "إن هذا الاعتذار ينبع من تقديرنا الصادق لكم ولجهودكم.",
            "نأمل أن تتقبلوا هذا الاعتذار برحابة صدر...",
            "وأن نفتح صفحة جديدة مبنية على الاحترام المتبادل.",
            "كل التقدير والإحترام لسيرفر Lag City RP ❤️"
        ];

        let lineIndex = 0;
        let charIndex = 0;
        let currentP = null;
        let cursorSpan = null;

        function typeWriter() {
            if (lineIndex < eventLines.length) {
                if (charIndex === 0) {
                    currentP = document.createElement('p');
                    currentP.className = 'typed-line';
                    if(lineIndex === 0) currentP.classList.add('main-title');
                    
                    cursorSpan = document.createElement('span');
                    cursorSpan.className = 'cursor';
                    cursorSpan.innerHTML = '&nbsp;';
                    currentP.appendChild(cursorSpan);
                    
                    container.appendChild(currentP);
                }

                currentP.insertBefore(document.createTextNode(eventLines[lineIndex].charAt(charIndex)), cursorSpan);
                charIndex++;

                container.scrollTop = container.scrollHeight;

                if (charIndex < eventLines[lineIndex].length) {
                    setTimeout(typeWriter, 50); 
                } else {
                    cursorSpan.remove();
                    lineIndex++;
                    charIndex = 0;
                    setTimeout(typeWriter, 1200); // وقت الانتظار بين كل سطر
                }
            }
        }

        // عند الضغط على شاشة الدخول: يختفي الزر، يعمل الصوت، وتبدأ الرسائل
        enterScreen.addEventListener('click', () => {
            // تشغيل الصوت
            audio.play();
            
            // إخفاء شاشة الدخول بتأثير ناعم
            enterScreen.style.opacity = '0';
            setTimeout(() => {
                enterScreen.style.display = 'none';
                
                // إظهار صندوق الرسائل وبدء الكتابة
                container.style.display = 'block';
                typeWriter();
            }, 800);
        });

    </script>
</body>
</html>
